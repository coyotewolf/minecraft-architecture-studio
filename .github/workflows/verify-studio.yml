name: Verify complete studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Scan source and Git history for credentials
        run: |
          python3 -m unittest discover -s scripts -p scan_secrets_test.py
          python3 scripts/scan_secrets.py --history
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run verify:vendor
      - run: npm run verify:lint-toolchain
      - run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=2048
      - name: Install browser for dependency compatibility checks
        run: npx playwright install chromium --with-deps
      - name: Verify editor, persistence and mobile browser flows
        run: npm run test:e2e -- e2e/viewer.spec.ts e2e/editor.spec.ts e2e/blueprint.spec.ts e2e/persistence.spec.ts e2e/mobile-editor.spec.ts
